name: public-safe-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate JSON and Python syntax
        run: |
          python -m compileall -q skills scripts
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("skills").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          print("JSON and Python syntax OK")
          PY
      - name: Run skill tests
        run: |
          python skills/brand-copy-studio/scripts/test_validate_brand_bundle.py
          python skills/social-content-studio/scripts/test_validate_content_spec.py
          python skills/social-content-studio/scripts/test_download_canva_export.py
      - name: Check public-safe release
        run: python scripts/check_public_release.py
